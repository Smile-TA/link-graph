# Postgres, Redis, the worker, and Astro (PRD §8; the Astro service added for
# docs/notes.md item 14 — see docs/04-operations.md §8). The API at step 11 still
# arrives later — infrastructure arrives when something needs it (implementation plan,
# ordering rule 3), and step 10 (the scheduler's queues) is the thing that needed Redis
# and a place to run the worker image.
#
#   docker compose up -d --wait     then  npm run test:integration
#
# `packages/scheduler/src/worker.int.test.ts` in particular creates its own ad hoc
# `crawl`-queue worker against this same Redis — if the real `worker` service is also
# running (as `docker compose up -d --wait` starts it), the two race as consumers of the
# same queue and the real one can steal the test's job, which then times out waiting for
# a completion that will never come from the mocked, in-process side. Measured 2026-09-28.
# `docker compose stop worker` first, run that test, `docker compose start worker` after.
#
# `--wait` is not optional. Measured 2026-08-20 on a fresh volume: for ~1.5s after
# the container starts, the published port accepts the TCP connection (docker's port
# proxy) and then resets it, because the entrypoint runs initdb against a unix socket
# only (`-c listen_addresses=''`). Without `--wait` the first integration run in a
# new checkout fails on a database that is about to work.
#
# The credentials below are a local container's and are deliberately not
# parameterized: packages/db falls back to exactly this DSN when DATABASE_URL is
# unset, and an override here that the fallback could not see would point the
# integration suite at a different server while it stayed green.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: link_graph
      POSTGRES_PASSWORD: link_graph
      POSTGRES_DB: link_graph
    ports:
      - "5432:5432"
    volumes:
      # A named volume, not a bind mount: measured, the official image sets
      # PGDATA=/var/lib/postgresql/18/docker and declares /var/lib/postgresql as its
      # volume, so a host path pinned to one layout breaks on a major upgrade.
      # `docker compose down -v` is the reset.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `-h localhost` on purpose: with no host, pg_isready probes the unix socket —
      # which is the socket initdb's temporary server is already serving, so the
      # container can report healthy while a TCP client still gets ECONNRESET.
      test: ["CMD-SHELL", "pg_isready -h localhost -U link_graph -d link_graph"]
      interval: 1s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://link_graph:link_graph@postgres:5432/link_graph
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # docs/notes.md item 4: a way to see the queues without shelling into Redis with
  # `redis-cli`. Plain `node:22-slim` + `npx`, no dedicated Dockerfile — `@bull-board/cli`
  # is a complete CLI, not something this repo builds or extends, so a build step would
  # only exist to re-solve the same TLS problem `Dockerfile.worker`/`Dockerfile.web`
  # solve (see their own comments) for zero benefit; mounting the same cert and setting
  # `NODE_EXTRA_CA_CERTS` does it without one.
  bull-board:
    image: node:22-slim
    command: >
      npx --yes @bull-board/cli --redis redis://redis:6379 --host 0.0.0.0 --port 3000
    environment:
      NODE_EXTRA_CA_CERTS: /certs/zscaler-root-ca.pem
    volumes:
      - ./certs/zscaler-root-ca.pem:/certs/zscaler-root-ca.pem:ro
    ports:
      # Loopback-only: `@bull-board/cli` itself warns on startup that with no
      # --user/--password, anyone who can reach the port can view *and modify or
      # delete* every queued job — bull-board's own dashboard has destructive actions,
      # unlike the read-only Astro dashboard, so the published port doesn't get the
      # same "just bind 0.0.0.0" treatment.
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  # docs/notes.md item 14: boots with the rest of the stack rather than a separate
  # `cd packages/web && npm run dev` every time. `DATABASE_URL`/`REDIS_URL` point at the
  # compose network names — `packages/db`/`packages/scheduler`'s own `localhost`
  # fallbacks (config.ts, queues.ts) are for a host process, and would resolve to
  # nothing inside this container. `REDIS_URL` was added for item 6's "next crawl"
  # column (`listNextCrawlTimes` reads BullMQ's own schedulers), so the sites list needs
  # Redis now too, not just Postgres.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DATABASE_URL: postgres://link_graph:link_graph@postgres:5432/link_graph
      REDIS_URL: redis://redis:6379
    ports:
      - "4321:4321"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
